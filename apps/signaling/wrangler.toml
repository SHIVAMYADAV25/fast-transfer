name = "fast-transfer-signaling"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "TRANSFER_ROOM"
class_name = "TransferRoom"

[[durable_objects.bindings]]
name = "STORED_TRANSFER"
class_name = "StoredTransfer"

#[[r2_buckets]]
#binding = "STORE_BUCKET"
#bucket_name = "kimo-store"
# Create the bucket first: `wrangler r2 bucket create kimo-store`

[[migrations]]
tag = "v1"
new_classes = ["TransferRoom"]

[[migrations]]
tag = "v2"
new_classes = ["StoredTransfer"]

[vars]
ALLOWED_ORIGINS = "http://localhost:3000,tauri://localhost,https://tauri.localhost"

# tauri://localhost is the desktop app's origin on macOS/Linux;
# https://tauri.localhost is the equivalent on Windows (WebView2). Both
# need to stay allowed alongside your real web domain(s) below, or the
# desktop app's signaling WebSocket will be rejected by CORS.
#
# For production, override with:
#   wrangler secret put ALLOWED_ORIGINS
# or set a [env.production.vars] block with your real domain(s).

#ALLOWED_ORIGINS = "https://ifrit-eight.vercel.app"

# For production, override with:
#   wrangler secret put ALLOWED_ORIGINS
# or set a [env.production.vars] block with your real domain(s).