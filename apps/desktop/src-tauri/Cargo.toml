[package]
name = "kimo"
version = "0.1.0"
description = "Kimo — direct, encrypted, peer-to-peer file transfer."
authors = ["Kimo contributors"]
edition = "2021"
rust-version = "1.77"

# See https://tauri.app/v1/api/config/#buildconfig.beforebuildcommand
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[lib]
name = "kimo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kimo"
path = "src/main.rs"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
