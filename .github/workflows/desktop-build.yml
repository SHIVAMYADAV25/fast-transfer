name: Build Kimo Desktop

# Cross-platform Tauri build for the Kimo desktop app.
#
# - Push a tag like v0.1.0 (or run this workflow manually) to build
#   installers for Windows, macOS Intel, macOS Apple Silicon, and Linux.
# - Every push/PR touching the relevant workspaces gets typecheck +
#   transfer-engine E2E verification.
#
# macOS:
# - Currently uses ad-hoc signing ("-").
# - No Apple Developer certificate/notarization is required yet.
# - Proper Apple signing can be added later.

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - "packages/protocol/**"
      - ".github/workflows/desktop-build.yml"

  pull_request:
    paths:
      - "apps/web/**"
      - "apps/desktop/**"
      - "packages/protocol/**"
      - ".github/workflows/desktop-build.yml"

  workflow_dispatch:

# The build job creates/uploads a GitHub Release.
permissions:
  contents: write

env:
  # These values are baked into the static web export at build time.
  NEXT_PUBLIC_SIGNALING_HTTP_URL: ${{ vars.NEXT_PUBLIC_SIGNALING_HTTP_URL }}
  NEXT_PUBLIC_SIGNALING_WS_URL: ${{ vars.NEXT_PUBLIC_SIGNALING_WS_URL }}
  NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}

  # Optional TURN configuration.
  NEXT_PUBLIC_TURN_URLS: ${{ vars.NEXT_PUBLIC_TURN_URLS }}
  NEXT_PUBLIC_TURN_USERNAME: ${{ vars.NEXT_PUBLIC_TURN_USERNAME }}
  NEXT_PUBLIC_TURN_CREDENTIAL: ${{ secrets.NEXT_PUBLIC_TURN_CREDENTIAL }}

jobs:
  # ---------------------------------------------------------------------------
  # VERIFY
  # ---------------------------------------------------------------------------
  verify:
    name: Typecheck + transfer engine E2E test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run transfer engine E2E test
        run: pnpm --filter @fast-transfer/web test:e2e

  # ---------------------------------------------------------------------------
  # NATIVE BUILDS
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.platform }})
    needs: verify

    # Native builds only happen:
    # - when manually running the workflow
    # - when pushing a version tag such as v0.1.0
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false

      matrix:
        include:
          # Apple Silicon
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"

          # Intel Mac
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"

          # Linux
          - platform: ubuntu-22.04
            args: ""

          # Windows
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      # -----------------------------------------------------------------------
      # CHECKOUT
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # NODE / PNPM
      # -----------------------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # -----------------------------------------------------------------------
      # LINUX DEPENDENCIES
      # -----------------------------------------------------------------------
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # -----------------------------------------------------------------------
      # RUST
      # -----------------------------------------------------------------------
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust build cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # -----------------------------------------------------------------------
      # JAVASCRIPT DEPENDENCIES
      # -----------------------------------------------------------------------
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # -----------------------------------------------------------------------
      # TAURI BUILD
      # -----------------------------------------------------------------------
      - name: Build and release with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # -------------------------------------------------------------------
          # macOS SIGNING
          #
          # Use ad-hoc signing for now.
          #
          # This avoids:
          #   security import
          #   failed to import keychain certificate
          #
          # Proper Apple Developer signing/notarization can be added later.
          # -------------------------------------------------------------------
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}

        with:
          # Tauri project is inside the monorepo.
          projectPath: apps/desktop

          # The action runs the Tauri CLI using the package's "tauri" script.
          #
          # apps/desktop/package.json MUST contain:
          #
          # "tauri": "tauri"

          # Release/tag used for manual development builds.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}

          releaseName: ${{ github.ref_type == 'tag' && format('Kimo {0}', github.ref_name) || 'Kimo dev build' }}

          releaseBody: |
            Kimo desktop build.

            Download the installer for your operating system below.

          # Keep releases as drafts until you manually verify them.
          releaseDraft: true

          # Manual builds are prereleases.
          # Version tags such as v0.1.0 are normal releases.
          prerelease: ${{ github.ref_type != 'tag' }}

          # We are not using the Tauri updater yet.
          includeUpdaterJson: false

          # Architecture-specific macOS targets.
          args: ${{ matrix.args }}